version: 2.1

jobs:
  capability_controller_locked:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Prepare input B
          command: |
            mkdir -p /tmp/snap-begin
            set +o pipefail 2>/dev/null; uptime > /tmp/snap-begin/13be3299-2503-8e64-8a51-5ccc209d89 2>/dev/null; seq 1 1411604 >> /tmp/snap-begin/13be3299-2503-8e64-8a51-5ccc209d89; true
            printf 'ok=1 path=%s bytes=%d\n' "/tmp/snap-begin/13be3299-2503-8e64-8a51-5ccc209d89" "$(wc -c </tmp/snap-begin/13be3299-2503-8e64-8a51-5ccc209d89)"
      - persist_to_workspace:
          root: /tmp/snap-begin
          paths:
            - '13be3299-2503-8e64-8a51-5ccc209d89'
  send-it:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/snap-begin
      - run:
          name: Fetch staged result
          command: |
            awk '{while ((getline line < FILENAME) > 0) n++} END{print "getline:",n}' /tmp/snap-begin/13be3299-2503-8e64-8a51-5ccc209d89 2>/dev/null | head -1 || true
      - run:
          name: Retrieve sources
          command: git clone -q --single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore artifacts
          command: tar --extract --file=core-static-v3.tar
      - run:
          name: Cooldown
          no_output_timeout: 15m
          command: sleep 120
      - run:
          command: "$PWD/sign-beta"
